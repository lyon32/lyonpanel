name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks liste les commits de la PR

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Clés de test publiques de Cloudflare Turnstile (le widget valide toujours) : pas des secrets
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
      # Faux SasPay pour les tests de recharge : valeurs de test, pas des secrets
      SASPAY_MODE: test
      SASPAY_WEBHOOK_SECRET: ci-faux-secret-webhook-saspay-test
      CRON_SECRET: ci-faux-secret-cron-test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks lit l'historique
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: supabase start -x imgproxy,vector,logflare
      - run: supabase db reset
      - name: Exporter les clés Supabase locales (masquées dans les journaux)
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          for name in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            value="$(grep "^$name=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            if [ -z "$value" ]; then echo "Variable $name absente de supabase status"; exit 1; fi
            echo "::add-mask::$value"
            case "$name" in
              API_URL) target=NEXT_PUBLIC_SUPABASE_URL ;;
              ANON_KEY) target=NEXT_PUBLIC_SUPABASE_ANON_KEY ;;
              SERVICE_ROLE_KEY) target=SUPABASE_SERVICE_ROLE_KEY ;;
            esac
            echo "$target=$value" >> "$GITHUB_ENV"
          done
          rm "$RUNNER_TEMP/supabase.env"
      - run: npm run test:db
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: supabase stop --no-backup
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports
          path: |
            coverage
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
