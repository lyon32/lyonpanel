name: Tâches planifiées

# Appelle les tâches de suivi de la production (suivi des commandes, rattrapage des recharges).
# Remplace le Worker Cloudflare prévu dans CI_CD.md (décision du propriétaire, 2026-11-17).
# GitHub peut retarder une exécution de quelques minutes : les tâches sont faites pour le supporter.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  appel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Suivi des recharges, des commandes et du solde fournisseur
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -u
          fail=0
          tasks='payments orders'
          # Solde fournisseur et synchro du catalogue : une fois par heure (premier passage de l'heure).
          [ "$(date -u +%M)" -lt 5 ] && tasks="$tasks provider-balance services"
          for task in $tasks; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_URL}/api/cron/${task}")
            echo "${task}: HTTP ${code}"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
